# NimbusCart — Phase 3 local MySQL via Docker
#
# Credentials come from the .env file in this same directory.
# The .env file is gitignored and must NEVER be committed.
#
# Usage:
#   docker compose up -d        ← start MySQL in background
#   docker compose down         ← stop (data is preserved in volume)
#   docker compose down -v      ← stop AND delete all data
#
# Docker is used ONLY for the local MySQL database.
# The Flask API runs directly with: python app/api/app.py

services:
  mysql:
    image: mysql:8.0
    container_name: nimbuscart_mysql
    restart: unless-stopped
    environment:
      # All values are read from the .env file — nothing is hardcoded here
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      # Named volume — MySQL data survives container restarts
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1",
             "-u", "${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data:
    # Persists on the Docker host even after "docker compose down"
    # Use "docker compose down -v" to also remove the volume (deletes all data)
